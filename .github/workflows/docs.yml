name: Publish the documentation

# Asks the documentation website (https://github.com/sylius-starter/docs) to rebuild,
# so that https://sylius-starter.github.io/docs/ follows the docs/ folder of main.
#
# Requires a DOCS_DISPATCH_TOKEN secret: a token allowed to create repository
# dispatch events (contents: write) on the documentation repository. Set the
# DOCS_REPOSITORY variable to target another repository than sylius-starter/docs.

"on":
    push:
        branches: ["main"]
        paths: ["docs/**"]
    workflow_dispatch: ~

permissions:
    contents: read

jobs:
    dispatch:
        name: Rebuild the documentation website
        if: ${{ !github.event.repository.fork }}
        runs-on: ubuntu-latest
        steps:
            - name: Send the docs-updated event
              env:
                  GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
                  DOCS_REPOSITORY: ${{ vars.DOCS_REPOSITORY || 'sylius-starter/docs' }}
              run: |
                  curl --fail-with-body -sS -X POST \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer ${GH_TOKEN}" \
                      "https://api.github.com/repos/${DOCS_REPOSITORY}/dispatches" \
                      -d '{"event_type": "docs-updated"}'
